name: ダッシュボードデータ同期

on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: UTAGEとYouTubeから集計
        env:
          UTAGE_API_KEY: ${{ secrets.UTAGE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/sync-dashboard.mjs

      - name: 更新データを公開
        run: |
          if git diff --quiet -- dashboard-data.json funnel-current.csv funnel-cohort.csv funnel-cohort-quality.csv funnel-sync-health.csv; then
            echo "データ変更なし"
            exit 0
          fi
          git config user.name "dashboard-sync"
          git config user.email "dashboard-sync@users.noreply.github.com"
          git add dashboard-data.json funnel-current.csv funnel-cohort.csv funnel-cohort-quality.csv funnel-sync-health.csv
          git commit -m "Update dashboard data"
          git push
